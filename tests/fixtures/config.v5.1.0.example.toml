# maibot-autonomous-planning-plugin 默认配置示例
#
# 使用方法：
# 1. 一般无需手动复制本文件。MaiBot Runner 会根据 config_models.py 自动生成 config.toml。
# 2. 如需手动配置，可将本文件复制为 config.toml 后修改。
# 3. 本文件展示 v5.0.0 的默认值；实际配置定义始终以 config_models.py 为准。


# =============================================================================
# 插件基础设置
# =============================================================================

[plugin]

# 是否启用插件。关闭后停止日程生成、注入、命令和后台任务。
enabled = true

# 配置结构版本，请勿手动修改。
config_version = "5.1.0"


# =============================================================================
# 后台清理
# =============================================================================

[autonomous_planning]

# 后台清理循环间隔，单位为秒。默认每小时执行一次。
cleanup_interval = 3600

# 已完成或已取消目标的保留天数。
cleanup_old_goals_days = 30


# =============================================================================
# 日程管理
# =============================================================================

[schedule]

# -----------------------------------------------------------------------------
# 日程注入
# -----------------------------------------------------------------------------

# 在 planner 决策阶段注入当前活动，影响是否回复以及使用哪个工具。
inject_schedule = true

# 在 replyer 生成回复前注入当前活动，使回复语气贴合角色状态。
inject_into_replyer = true

# 用户询问日程且当天没有日程时，是否自动调用 LLM 生成。
auto_generate = true

# 注入文本中最多展示多少条后续活动；0 表示不展示。
max_future_activities = 3


# -----------------------------------------------------------------------------
# 日程生成
# -----------------------------------------------------------------------------

# 角色当前的长期生活阶段或持续状态。
# 示例："正在环游世界"、"备考研究生"。留空使用默认生成逻辑。
custom_prompt = ""

# 首轮质量不达标时，是否根据结构化反馈重新生成。
use_multi_round = true

# 多轮生成的最大轮数，允许 1-5，推荐 2。
max_rounds = 2

# 日程质量达到该分数后提前结束重试，范围 0.0-1.0。
quality_threshold = 0.85

# 单日日程的最少和最多活动数量。
min_activities = 8
max_activities = 15

# 是否生成并展示较详细的活动描述。
enable_detailed_description = true

# 活动描述的建议字符数范围。
min_description_length = 20
max_description_length = 50

# 单次日程生成允许的最大 token 数。
max_tokens = 8192

# 单次 LLM 请求超时时间，单位为秒。
generation_timeout = 180.0

# 仅当 Provider/API 明确报告超时、HTTP 524 或连接类错误时重试。
# cap.call 能力 RPC 超时具有结果不确定性，为避免重复扣费不会自动重试。
generation_max_retries = 1

# 首次 Provider 重试前等待秒数；后续重试按 30、60、120 秒指数退避。
generation_retry_backoff = 30.0

# 生成新日程时回看最近多少天，用于减少活动内容的机械重复。
recent_schedule_days = 3


# -----------------------------------------------------------------------------
# 固定睡眠窗口
# -----------------------------------------------------------------------------

# 程序级固定睡眠开始时间，格式必须为 HH:MM。
sleep_start_time = "01:00"

# 程序级固定睡眠结束时间；作为区间结束时额外允许 24:00。
sleep_end_time = "08:00"

# 无睡眠模式。
# true 时关闭固定睡眠块、睡眠 Prompt、睡眠频率静默和睡眠主动行为限制。
no_sleep_mode = false

# -----------------------------------------------------------------------------
# 定时生成与次日策略推断
# -----------------------------------------------------------------------------

# 是否每天定时生成下一天的日程。
auto_schedule_enabled = true

# 每日自动生成时间，24 小时制 HH:MM。
auto_schedule_time = "00:30"

# 是否在晚间根据近期活动自动推断下一天的生活重点；实验功能。
auto_infer_next_day_prompt = false

# 执行次日策略推断的时间。
infer_time = "22:30"

# 次日策略推断回看的历史天数，允许 1-7。
infer_lookback_days = 3

# 推断结果允许写入的最大字符数。
infer_max_prompt_chars = 300

# 推断次日状态时是否参考活动状态和完成进度。
infer_use_completion_signal = true


# -----------------------------------------------------------------------------
# 聊天、记忆与跨午夜活动
# -----------------------------------------------------------------------------

# 从允许的聊天流中读取多少条近期消息作为生成上下文；0 表示关闭。
history_message_limit = 30

# 从知识库检索的最大条数；0 表示关闭。
knowledge_search_limit = 5

# 是否允许活动跨越午夜，并在凌晨读取昨天延续至今天的活动。
cross_day_activity = true


# -----------------------------------------------------------------------------
# LLM 与日志
# -----------------------------------------------------------------------------


# 是否把 LLM 请求和响应归档到 data/llm_logs/，便于排查生成问题。
llm_log_enabled = true

# LLM 调用日志的保留天数。
llm_log_retention_days = 7


# -----------------------------------------------------------------------------
# 角色裁判
# -----------------------------------------------------------------------------

# 是否让 LLM 按角色人设判断日程更新请求应立即执行、延后还是拒绝。
role_judge_enabled = true

# 角色裁判的模型温度，范围 0.0-2.0；越低越保守。
role_judge_temperature = 0.3


# -----------------------------------------------------------------------------
# 缓存
# -----------------------------------------------------------------------------

# 日程缓存有效期，单位为秒。
cache_ttl = 300

# LRU 日程缓存的最大条目数。
cache_max_size = 100


# -----------------------------------------------------------------------------
# 权限与聊天流白名单
# -----------------------------------------------------------------------------

# 可执行 /plan 命令的用户 ID。空列表表示所有用户均可执行。
# 示例：admin_users = ["123456789"]
admin_users = []

# 可使用日程注入和命令的聊天流。空列表表示全部允许。
# 支持 "all"、"session:<id>"、"qq:group:<群号>"、"qq:private:<QQ号>"。
# 示例：allowed_streams = ["qq:group:123456", "qq:private:789012"]
allowed_streams = []


# -----------------------------------------------------------------------------
# 主动行为
# -----------------------------------------------------------------------------

# 允许主动发起对话的聊天流。空列表表示禁用插件主动发言。
# 支持 "session:<id>"、"qq:group:<群号>"、"qq:private:<QQ号>"。
# 示例：proactive_streams = ["qq:group:123456"]
proactive_streams = []

# 是否允许在活动刚开始时主动发起自然对话。
enable_proactive_trigger = true

# -----------------------------------------------------------------------------
# 时区
# -----------------------------------------------------------------------------

# IANA 时区名。服务器与角色所在时区不同时务必显式设置。
timezone = "Asia/Shanghai"


# =============================================================================
# 日程生成模型选择
# =============================================================================

[schedule.model]

# task：按 Maibot 模型任务类别路由、重试和 fallback。
# model：指定 model_config.toml 中的某个具体模型。
mode = "task"

# mode = "task" 时使用的 Maibot 任务类别，例如 replyer 或 planner。
# mode = "model" 时不使用该字段，仅为以后切回 task 模式保留。
task = "replyer"

# mode = "model" 时生效，支持 model_config.toml 的 models[].name 或 model_identifier。
# 插件会构造只包含目标模型的 TaskConfig；不存在或实际模型不符时拒绝生成。
model = ""


# =============================================================================
# 动态发言频率
# =============================================================================

[schedule.frequency]

# 是否在固定睡眠时间应用睡眠系数。
enable_sleep = true

# 是否在非睡眠时间按当前日程活动类型应用活动系数。
enable_activity = true

# 睡眠期间的频率乘数。0.0 表示静默；允许大于 1。
sleep_factor = 0.0

# 独立调频会话白名单。空列表表示 Host 当前全部已存在聊天流。
# 支持 "session:<id>"、"qq:group:<群号>"、"qq:private:<QQ号>"。
frequency_streams = []

[schedule.frequency.activity_factors]

# 各 goal_type 的活动频率乘数；未知类型使用 1.0。
daily_routine = 1.0
meal = 1.2
study = 0.3
entertainment = 1.5
social_maintenance = 1.5
exercise = 0.7
learn_topic = 0.5
rest = 1.3
free_time = 1.3
custom = 1.0


# =============================================================================
# 智能注入策略
# =============================================================================

[inject]

# 是否识别消息意图，用于过滤技术问答等不适合注入日程的场景。
enable_intent_classification = true

# 是否根据活动进度生成“刚开始/进行中/快结束”等自然状态提示。
enable_state_analysis = true

# 是否启用注入去重、冷却和无效打扰过滤。
enable_inject_optimization = true

# 普通闲聊场景触发日程注入的概率，范围 0.0-1.0。
casual_chat_inject_probability = 0.5

# 连续讨论日程话题时保留的对话轮数。
context_max_turns = 3

# 对话上下文过期时间，单位为秒。
context_ttl = 600
