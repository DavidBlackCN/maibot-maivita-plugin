# MaiVita. Set storage.writer_lock to one shared absolute deployment path.
# SDK data_dir is preferred; storage.data_dir is an absolute fallback.
[plugin]
enabled = true
config_version = "1"

[character]
timezone = "Asia/Shanghai"
life_context = ""
character_id = "default"

[routine]
preferred_sleep_time = "01:00"
preferred_wake_time = "08:00"

[planning]
daily_enabled = true
daily_trigger_time = "00:30"
generate_on_request = true
direction_summary_enabled = false
direction_time = "22:30"
direction_lookback_days = 3
direction_max_prompt_chars = 300
direction_use_completion_signal = true
max_daily_items = 15
history_days = 3
use_multi_round = true
max_rounds = 2
quality_threshold = 0.85
enable_detailed_description = true
min_description_length = 20
max_description_length = 50
history_message_limit = 30
knowledge_search_limit = 5
role_judge_enabled = true
role_judge_temperature = 0.3
mode = "legacy"

[sleep]
mode = "legacy_fixed"

[models]
max_tokens = 8192
generation_timeout = 180.0
generation_max_retries = 1
generation_retry_backoff = 30.0

[models.strategic]
mode = "task"
task = "replyer"
model = ""

[integration]
allowed_streams = []
inject_schedule = true
inject_into_replyer = true
max_future_activities = 3

[integration.injection]
enable_intent_classification = true
enable_state_analysis = true
enable_inject_optimization = true
casual_chat_inject_probability = 0.5
context_max_turns = 3
context_ttl = 600

[admin]
legacy_admin_users = []

[runtime]
cache_ttl = 300
cache_max_size = 100

[storage]
data_dir = ""
writer_lock = ""
cleanup_interval = 3600
history_detail_days = 7

[observability]
model_logs_enabled = true
model_logs_retention_days = 7

[compatibility]
legacy_sleep_start_time = "01:00"
legacy_sleep_end_time = "08:00"
proactive_streams = []
enable_proactive_trigger = true
cross_day_activity = true
min_activities = 8
legacy_empty_admin_all = false

[compatibility.frequency]
enable_sleep = true
enable_activity = true
sleep_factor = 0.0
frequency_streams = []

[compatibility.frequency.activity_factors]
daily_routine = 1.0
meal = 1.2
study = 0.3
entertainment = 1.5
social_maintenance = 1.5
exercise = 0.7
learn_topic = 0.5
rest = 1.3
free_time = 1.3
custom = 1.0
