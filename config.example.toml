# MaiVita 0.3.0. Explicit isolated-instance activation only.
[plugin]
enabled = false
config_version = "3"

[engine]
mode = "life"

[instance]
acknowledgement = ""
writer_lock = ""
allowed_streams = []
timezone = "Asia/Shanghai"
frequency_enabled = false
owner_auth_enabled = false
privileged_writes_enabled = false

[model]
task_name = "utils"
model_name = ""
timeout_seconds = 25
max_tokens = 2048
daily_budget = 8
generate_on_start = false
life_context = ""

# For the legacy profile, fill [legacy] using the former version-1 example.
# Lifecycle root enable/lock settings override the nested legacy values.
[legacy.plugin]
enabled = false
config_version = "1"

[legacy.planning]
daily_enabled = false

[legacy.admin]
legacy_admin_users = []

[legacy.compatibility]
proactive_streams = []
enable_proactive_trigger = false
legacy_empty_admin_all = false
