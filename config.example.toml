# 常用配置示例，未列出的参数使用默认值。
# 使用 MaiBot 已有的 planner 模型和人设，无需在此填写密钥。
[plugin]
enabled = true
config_version = "4"

[instance]
# 留空沿用 Host/适配器允许的全部会话；也可填写精确的会话 ID。
allowed_streams = []
timezone = "Asia/Shanghai"

[model]
# 参考计划和滚动生活共用；失败及重试也计入。
daily_budget = 20
# 可选：例如“工作日通常在家学习，周末喜欢散步”。留空沿用 Host 人设。
life_context = ""
daily_planning_enabled = true
daily_planning_time = "08:00"

[routine]
# 仅供角色参考，不是强制静音时刻。
preferred_sleep_time = "01:00"
preferred_wake_time = "08:00"
