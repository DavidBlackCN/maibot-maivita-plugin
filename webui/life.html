<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font:15px/1.65 system-ui,sans-serif;color:var(--text-primary,#25362f);background:var(--background,#f5f7f3)}
*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1100px;margin-inline:auto}h1{font-size:27px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}p{margin:5px 0}small,.muted{color:#68796e}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card,section{background:var(--card,#fff);border:1px solid #b5c7b64d;border-radius:16px;padding:20px;margin-bottom:16px}.hero{font-size:24px;color:#397355}button,input{font:inherit;border-radius:8px;padding:7px 12px;border:1px solid #7b998b;background:transparent;color:inherit}button{cursor:pointer}button:hover{background:#7b998b22}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:10px 14px;border-left:3px solid #779d87;white-space:pre-wrap;margin-bottom:15px}#error{color:#b34530}ul{padding-left:22px}li{margin-bottom:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #b5c7b64d;padding:8px;vertical-align:top;overflow-wrap:anywhere}.scroll{overflow:auto}details{margin-top:12px}summary{cursor:pointer}progress{width:100%;height:8px;accent-color:#56866b}.value{font-size:22px}label{display:inline-flex;gap:8px;align-items:center}input{width:100px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
@media(max-width:540px){body{padding:12px}header{align-items:flex-start}h1{font-size:22px}.card,section{padding:14px}th,td{padding:5px}}
@media(prefers-color-scheme:dark){:root{color:#e1e9e3;background:#18211c}.card,section{background:#222e26}.muted,small{color:#adbcaf}.hero{color:#a4d1b4}}
</style></head><body>
<header><div><small>MAIVITA · 角色生活</small><h1 id="title">此刻生活</h1><p class="muted" id="time">正在读取…</p></div><button id="refresh">刷新</button></header>
<nav><button data-page="now">此刻生活</button><button data-page="history">今日与最近</button><button data-page="runtime">设置与运行</button></nav>
<div id="error" role="alert"></div><div id="notice" class="notice" role="status">生活状态是角色模拟估计。</div><main id="content"></main>
<script type="module">
const $=id=>document.getElementById(id);let timer,closed=false,loading=false,acting=false,last;
const titles={now:'此刻生活',history:'今日与最近',runtime:'设置与运行'};
const phases={awake:'清醒',winding_down:'准备睡觉',sleeping:'睡眠中',temporarily_awake:'睡眠中短暂醒来',waking:'正在醒来'};
const labels={energy:'精力',fatigue:'疲劳',stress:'压力',sleepiness:'困意'};
const states={running:'执行中',success:'已完成',failed:'失败',deferred:'未执行或已延后',unknown:'待核对',applied:'已应用',invalid:'结果无效',uncertain:'结果未知',abandoned:'已中断',stale:'状态已变化',validated:'已校验',candidate_validated:'模型已返回有效建议',unavailable_unknown_outcome:'模型结果待核对',invalid_response:'模型返回无效',cancelled_unknown_outcome:'已取消，结果待核对'};
const reasons={cooldown:'距上次决策不足一分钟，稍后再试',budget_exhausted:'今日生活额度已用完',no_triggers:'当前没有新的决策理由',process_restart_unknown_outcome:'重启前的结果待核对'};
const reason=v=>reasons[v]||states[v]||v;
const feeling=(key,v)=>v==null?'记录不足':key==='energy'?(v<=20?'需要休息':v<=40?'有些疲倦':v>=70?'精力尚好':'平常'):key==='sleepiness'?(v>=80?'很想睡觉':v>=65?'有些困了':'尚清醒'):key==='fatigue'?(v>=80?'很疲倦':v>=60?'有些累':'平常'):(v>=70?'有些紧绷':'平常');
const fmt=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:last?.calendar.timezone,hour12:false}):'暂无';
function node(tag,text,parent,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e}
function section(title,parent=$('content')){const e=node('section',null,parent);node('h2',title,e);return e}
function table(headers,rows,parent){const wrap=node('div',null,parent,'scroll'),t=node('table',null,wrap),h=node('tr',null,node('thead',null,t));headers.forEach(x=>node('th',x,h));const b=node('tbody',null,t);for(const row of rows){const tr=node('tr',null,b);row.forEach(x=>node('td',x??'—',tr))}}
function button(label,action,parent,extra={}){const b=node('button',label,parent);b.disabled=acting;b.onclick=()=>act(action,b,extra);return b}
async function act(action,b,extra){if(acting)return;acting=true;b.disabled=true;$('error').textContent='';try{const request_id=crypto.randomUUID();await maibot.action('manage',{action,request_id,...extra});$('notice').textContent='操作已受理，可在运行页面查看结果。';await refresh()}catch(e){$('error').textContent=e.message||String(e)}finally{acting=false;document.querySelectorAll('main button').forEach(x=>x.disabled=false);b.disabled=false}}
function render(d){last=d;$('time').textContent=fmt(d.facts.as_of)+' · '+d.calendar.weekday+' · '+d.calendar.timezone;$('content').replaceChildren();const page=maibot.page.id;$('title').textContent=titles[page]||titles.now;
if(page==='now'){
 const a=d.facts.activity,s=section(phases[d.facts.sleep_phase]||'状态未知');node('p',a?.name||'暂无公开活动',s,'hero');node('p',[a?.location,a?.emotion].filter(Boolean).join(' · ')||'等一段新的生活开始',s);node('p',a?.continuity_unknown?'活动持续时间未知':a?`已进行约 ${Math.floor(a.duration_minutes)} 分钟`:'',s,'muted');node('p',`下次检查约 ${d.status.next_check_seconds} 秒后；预计活动结束或醒来：${fmt(d.state.next_deadline_at)}`,s,'muted');
 const cards=node('div',null,$('content'),'cards');for(const [key,label] of Object.entries(labels)){const c=node('div',null,cards,'card');node('h2',label,c);node('p',feeling(key,d.facts.body[key]),c,'value');const details=node('details',null,c);node('summary','查看模拟读数',details);node('p',d.facts.body[key]==null?'未知':Math.round(d.facts.body[key])+' / 100',details);const p=node('progress',null,details);p.max=100;if(d.facts.body[key]!=null)p.value=d.facts.body[key]}
 const talk=section('聊天参与');node('p',d.participation.reason,talk,'hero');node('p',d.frequency_enabled?`普通群聊生活倍率 ×${d.participation.multiplier}；${d.frequency}`:'生活调频已关闭',talk);node('p','清醒时被点名、私聊和正在进行的直接对话沿用麦麦设置；睡眠及静音限制独立生效。',talk,'muted');
 const body=section('状态依据');node('p',d.facts.awake?`本次清醒 ${d.state.awake_minutes==null?'时长未知':Math.floor(d.state.awake_minutes)+' 分钟'}`:`本次睡眠已记录 ${Math.floor(d.state.sleep_session_minutes||0)} 分钟`,body);node('p','精力、疲劳与压力按活动类别变化；困意清醒每小时 +5、睡眠每小时 −10。初始值为 50，均为模拟估计。',body);node('p',`近期缺眠估计：${d.state.sleep_debt_minutes==null?'记录不足':Math.round(d.state.sleep_debt_minutes)+' 分钟'}；完整记录 ${d.state.sleep_history_coverage_days} 天。停机区间不补算。`,body,'muted');
 const controls=section('管理生活'),bar=node('div',null,controls,'actions');button('重新决定当前活动','replan',bar);button('唤醒','wake',bar);const label=node('label','睡眠分钟',bar),input=node('input',null,label);input.type='number';input.min=5;input.max=720;input.value=30;const sleep=button('请求睡眠','sleep',bar);sleep.onclick=()=>act('sleep',sleep,{minutes:Number(input.value)});
}else if(page==='history'){
 const calendar=section('今日');node('p',[d.calendar.date,d.calendar.weekday,...d.calendar.festivals].join(' · '),calendar);node('p',d.calendar.statutory?.on_holiday?'法定假日':d.calendar.statutory?.is_makeup_workday?'调休补班':d.calendar.note,calendar,'muted');
 const plan=section('参考计划');node('p','这是打算，实际活动可以变化。',plan,'muted');if(d.plan.items.length)table(['时间','活动'],d.plan.items.map(i=>[fmt(i.start_at||i.window_start_at),i.name]),plan);else node('p','今天尚无参考计划。',plan);button('重新生成今日参考计划','plan',plan);
 const history=section('实际活动');if(d.facts.continuity_unknown)node('p','近期有观察缺口，缺失期间的经历未知。',history,'notice');const list=node('ul',null,history);for(const a of d.facts.history){const li=node('li',null,list);node('strong',a.name,li);node('p',fmt(a.started_at)+' — '+(a.ended_at?fmt(a.ended_at):'进行中'),li,'muted');for(const detail of a.reflection?.details||[])node('p','角色模拟 · '+detail,li)}if(!d.facts.history.length)node('p','暂无生活记录。',history);
 const notes=section('待继续');for(const item of d.facts.continuing){const e=node('div',null,notes);node('strong',item.name,e);node('p',item.next_step,e);const bar=node('div',null,e,'actions');button('结束接续','end_note',bar,{activity_id:item.activity_id});button('放下这件事','abandon_note',bar,{activity_id:item.activity_id})}if(!d.facts.continuing.length)node('p','暂无待继续的事情。',notes);
 const sleep=section('最近睡眠');table(['开始','预计醒来','实际结束'],d.sleep.map(s=>[fmt(s.started_at),fmt(s.expected_wake_at),fmt(s.ended_at)]),sleep);
}else{
 const config=section('常用设置');node('p','在麦麦的「插件 → MaiVita → 配置」中修改并按宿主提示重载。',config);table(['设置','当前值'],[['角色时区',d.calendar.timezone],['偏好入睡',d.settings.routine.preferred_sleep_time],['偏好醒来',d.settings.routine.preferred_wake_time],['每日参考计划',d.settings.model.daily_planning_enabled?'开启':'关闭'],['生活调频',d.frequency_enabled?'开启':'关闭']],config);
 const budget=section('生活模型');node('p',`今日尝试 ${d.status.used} / ${d.status.budget} 次，失败也计入。`,budget,'hero');node('p',`日期：${d.calendar.calendar_status==='available'?'已连接日期插件':'节假日信息不完整或暂不可用'}；频率：${d.frequency}`,budget);
 const jobs=section('最近管理操作');table(['时间','状态','结果'],d.jobs.map(j=>[fmt(j.created_at_ms),states[j.status]||j.status,reason(j.result?.message||j.result?.reason||j.result?.status||'—')]),jobs);
 const decisions=section('最近生活决策');table(['时间','状态','原因'],d.decisions.map(r=>[fmt(r.started_at_ms),states[r.status]||r.status,reason(r.diagnostic||'—')]),decisions);
 const usage=section('最近模型调用');table(['时间','类型','耗时','结果','Token'],d.usage.map(u=>[fmt(u.started_at_ms),u.task_kind==='planning'?'参考计划':'活动决策',u.elapsed_seconds+' 秒',states[u.status]||u.status,u.tokens?.total_tokens??'未提供']),usage);
}}
async function refresh(){if(loading||closed||document.hidden)return;loading=true;$('refresh').disabled=true;try{render(await maibot.query('overview',{}));$('error').textContent=''}catch(e){$('error').textContent='读取失败：'+(e.message||e)}finally{loading=false;$('refresh').disabled=false}}
await maibot.ready;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>maibot.navigate(b.dataset.page));$('refresh').onclick=refresh;await refresh();timer=setInterval(refresh,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('pagehide',()=>{closed=true;clearInterval(timer)});
</script></body></html>
