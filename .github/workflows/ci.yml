name: MaiVita checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  MAIBOT_EVIDENCE_DIR: ../docs/reports/maibot-maivita-plugin
jobs:
  isolated:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-i0.txt
      - name: Static compilation
        run: python -m compileall -q plugin.py maivita tools tests integration_tests
      - name: Unit regressions
        run: python tools/run_tests.py --report-prefix ci-regression
      - name: Pytest regressions
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Pinned original Runner source
        run: python tools/setup_i0_host.py
      - name: Native isolated Runner and cleanup
        run: python tools/run_i0.py --verify-environment
      - name: Preserve current CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maivita-checks-${{ github.sha }}
          path: |
            ../docs/reports/maibot-maivita-plugin/ci-regression.json
            ../docs/reports/maibot-maivita-plugin/i0/results.json
            ../docs/reports/maibot-maivita-plugin/i0/environment-tests.json
      # Full Host + real model is a separately recorded local gate; no keys,
      # external accounts or production configuration are available to this job.

  linux-1-3-15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIBOT_HOST_VERSION: '1.3.15'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --upgrade maibot-plugin-sdk==2.16.0
      - name: Linux unit regressions on deployment SDK (no platform or model calls)
        run: python -m pytest tests -q -p no:cacheprovider --junitxml "${{ runner.temp }}/linux-unit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-1-3-15-${{ github.sha }}
          path: ${{ runner.temp }}/linux-unit.xml
