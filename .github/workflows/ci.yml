name: MaiVita checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Host ${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, host: '1.3.18', sdk: '2.19.0'}
          - {os: ubuntu-latest, host: '1.3.18', sdk: '2.19.0'}
          - {os: ubuntu-latest, host: '1.3.15', sdk: '2.16.0'}
          - {os: ubuntu-latest, host: '1.3.12', sdk: '2.15.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MAIBOT_HOST_VERSION: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and selected SDK
        run: python -m pip install -r requirements-dev.txt maibot-plugin-sdk==${{ matrix.sdk }}
      - name: Unit tests (synthetic model and platform)
        env:
          MAIBOT_EVIDENCE_DIR: ${{ runner.temp }}/maivita-evidence
        run: python -m pytest tests -q -p no:cacheprovider -o asyncio_default_fixture_loop_scope=function --junitxml "${{ runner.temp }}/maivita-evidence/unit.xml"
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maivita-unit-${{ matrix.os }}-${{ matrix.sdk }}-${{ github.sha }}
          path: ${{ runner.temp }}/maivita-evidence

  runner-contracts:
    name: Isolated Runner and Windows process cleanup
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MAIBOT_HOST_VERSION: '1.3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated Runner dependencies
        run: python -m pip install -r integration_tests/requirements.txt
      - name: Prepare pinned Runner source
        run: python tools/setup_i0_host.py
      - name: Native Runner, permissions, reload and process cleanup
        env:
          MAIBOT_EVIDENCE_DIR: ${{ runner.temp }}/maivita-runner-evidence
        run: python tools/run_i0.py --verify-environment
      - name: Preserve Runner reports and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maivita-runner-${{ github.sha }}
          path: ${{ runner.temp }}/maivita-runner-evidence
